name: Build site
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout github.io repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build outputs
        run: |
          mkdir -p dist
          python scripts/build.py \
            --site data/site.yaml \
            --showcase data/showcase.yaml \
            --out-html index.html \
            --out-readme dist/profile-README.md

      - name: Commit regenerated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged"
          else
            git commit -m "build: regenerate index.html [skip ci]"
            git push
          fi

      - name: Push profile README
        env:
          PROFILE_REPO_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
        run: |
          if [ -z "$PROFILE_REPO_TOKEN" ]; then
            echo "PROFILE_REPO_TOKEN not set - skipping profile README push"
            exit 0
          fi
          git clone "https://x-access-token:${PROFILE_REPO_TOKEN}@github.com/mahmood726-cyber/mahmood726-cyber.git" /tmp/profile
          cp dist/profile-README.md /tmp/profile/README.md
          cd /tmp/profile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "profile README unchanged"
          else
            git commit -m "build: regenerate profile README"
            git push
          fi
