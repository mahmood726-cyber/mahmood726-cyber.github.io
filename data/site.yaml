about: >-
  Cardiology specialist at the Royal Free Hospital, London, with a research
  home at the Tahir Heart Institute. I build evidence-synthesis tools, run a
  weekly micro-paper course at Makerere, and lead methods atlases on
  prediction-interval calibration, reproduction floors, and African
  representation in Cochrane reviews.
